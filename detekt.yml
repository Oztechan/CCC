# https://github.com/detekt/detekt/blob/main/detekt-core/src/main/resources/default-detekt-config.yml
# This file is used to override default detekt rules
# the rules are not listed here will be used from default detekt config listed in the link above

config:
  validation: true
  warningsAsErrors: true
  checkExhaustiveness: false

style:
  WildcardImport:
    active: true
    excludeImports: [ ] # default config excludes java.util.*
  # Compose UI idioms: numeric literals in composables/previews (dp, weights, colors, sample
  # data) and in property declarations (theme palettes) are expected, not code smells.
  MagicNumber:
    ignorePropertyDeclaration: true
    ignoreAnnotated: [ 'Composable', 'Preview' ]
  # @Preview composables are invoked by the IDE preview renderer, not by code.
  UnusedPrivateMember:
    ignoreAnnotated: [ 'Preview' ]

complexity:
  NamedArguments:
    active: true

naming:
  FunctionNaming:
    active: true
    ignoreAnnotated: [ 'Composable' ]
